<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工程不良數據點檢系統 (mambers0908)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-1: #fff8e8;
      --bg-2: #f8e9c7;
      --bg-3: #e8d6ae;
      --bg-4: #c6b07e;
      --bg-5: #8d7655;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --mint: #9ed6b1;
      --mint-dark: #4f8e69;
      --sky: #9fcbe0;
      --blue: #547fa3;
      --purple: #9b83c7;
      --pink: #d58a8e;
      --gold: #f4c95d;
      --gold-2: #c88c32;
      --red: #b94e4e;
      --ink: #3d2c20;
      --text: #4b3829;
      --muted: #79634c;
    }

    * { box-sizing: border-box; }

    body {
      background:
        radial-gradient(circle at top left, rgba(255, 224, 143, 0.48), transparent 18%),
        radial-gradient(circle at bottom right, rgba(112, 82, 53, 0.18), transparent 24%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 22%, var(--bg-3) 45%, var(--bg-4) 70%, var(--bg-5) 100%);
      min-height: 100vh;
      color: var(--text);
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(91, 65, 38, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91, 65, 38, 0.09) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.38;
      pointer-events: none;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.25deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    @keyframes float-delayed {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-0.35deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .animate-float-card {
      animation: float 6s ease-in-out infinite;
    }

    .animate-float-card-delayed {
      animation: float-delayed 7s ease-in-out infinite 1s;
    }

    .glass-card {
      background: linear-gradient(180deg, rgba(255,252,239,0.94), rgba(242, 226, 187, 0.9));
      border: 3px solid rgba(255,250,224,0.95);
      box-shadow: 0 0 0 4px rgba(92, 63, 35, 0.12), 0 18px 30px rgba(74, 49, 27, 0.2), inset 0 6px 0 rgba(255,255,255,0.58);
      position: relative;
      overflow: hidden;
      border-radius: 28px;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255, 220, 123, 0.2), transparent 100%);
      transform: translateX(-100%);
      pointer-events: none;
    }

    .hud-bar {
      border-radius: 30px;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 auto 1.5rem;
      max-width: 1280px;
      background: linear-gradient(180deg, #fff4c9, #e7d2a5);
      border: 3px solid rgba(255,250,224,0.95);
      box-shadow: 0 8px 0 rgba(87, 57, 27, 0.2), 0 18px 28px rgba(48, 35, 24, 0.16);
    }

    .game-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      font-size: 0.8rem;
    }

    .game-logo-mark {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffe9a4, #d99843);
      border: 3px solid rgba(255,255,255,0.8);
      box-shadow: 0 5px 0 rgba(122, 95, 59, 0.16);
      font-size: 1.2rem;
    }

    .hud-stats {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hud-pill {
      padding: 0.45rem 0.8rem;
      border-radius: 999px;
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 2px solid rgba(66, 124, 127, 0.12);
      background: rgba(255,255,255,0.5);
      color: var(--muted);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.5);
    }

    .hud-pill strong {
      color: var(--mint-dark);
      margin-left: 0.3rem;
      font-weight: 900;
    }

    .mission-badge {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.55rem 0.85rem;
      border-radius: 16px;
      background: linear-gradient(180deg, #fff2bf, #ffe0a3);
      border: 2px solid rgba(255, 179, 71, 0.75);
      box-shadow: 0 4px 0 rgba(151, 117, 74, 0.15);
    }

    .mission-badge span {
      font-size: 0.62rem;
      color: #6d4d32;
      letter-spacing: 0.17em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .mission-badge strong {
      color: #2a5664;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      font-weight: 900;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-bottom: 0.8rem;
      margin-bottom: 1rem;
      border-bottom: 2px dashed rgba(56, 125, 116, 0.2);
      position: relative;
      z-index: 1;
    }

    .panel-title h2 {
      font-size: 1.08rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #275968;
      font-weight: 900;
    }

    .panel-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffe0ef, #ffcfe6);
      border: 2px solid rgba(255, 138, 191, 0.8);
      color: #7a4b6d;
      font-weight: 900;
    }

    .custom-form {
      position: relative;
      z-index: 1;
    }

    .field {
      margin-bottom: 0.8rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.45rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #3e6d7b;
      font-weight: 800;
    }

    .neon-input {
      transition: all 0.25s ease;
      background: rgba(255,255,255,0.62);
      color: var(--ink);
      border: 2px solid rgba(72, 129, 136, 0.2);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.4);
    }

    .neon-input:focus {
      outline: none;
      border-color: rgba(96, 193, 174, 0.9);
      box-shadow: 0 0 0 3px rgba(96, 193, 174, 0.18), inset 0 2px 0 rgba(255,255,255,0.4);
      transform: translateY(-1px);
    }

    .neon-button {
      transition: all 0.2s ease;
      border: 3px solid rgba(255,255,255,0.85);
      background: linear-gradient(180deg, #ffe99c, #ffc76d);
      color: #274c64;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 6px 0 rgba(126, 101, 60, 0.18), 0 12px 18px rgba(96, 193, 174, 0.12);
    }

    .neon-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(126, 101, 60, 0.18), 0 14px 20px rgba(96, 193, 174, 0.16);
    }

    .refresh-button {
      border: 2px solid rgba(84, 146, 159, 0.2);
      background: linear-gradient(180deg, #ffffff, #edfefc);
      color: #315a63;
      box-shadow: 0 4px 0 rgba(98, 142, 155, 0.12);
      border-radius: 14px;
      font-weight: 800;
    }

    .refresh-button:hover {
      background: rgba(255,255,255,0.84);
    }

    .neon-spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, #ffd86b 50%, #ff9ac1 100%);
      mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 3px));
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 3px));
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .game-table thead th {
      color: #356b7e;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 900;
    }

    .game-table tbody tr {
      border-bottom: 1px dashed rgba(68, 120, 138, 0.18);
    }

    .game-table tbody tr:hover {
      background: rgba(255,255,255,0.2);
    }

    .rpg-sidebar {
      background: linear-gradient(180deg, rgba(83, 56, 34, 0.97), rgba(55, 39, 28, 0.98));
      border: 3px solid #d9ae61;
      box-shadow: 0 0 0 4px rgba(82, 51, 25, 0.2), 0 18px 30px rgba(51, 31, 16, 0.28);
    }

    .rpg-sidebar .panel-title { border-bottom-color: rgba(244, 201, 93, 0.3); }

    .rpg-sidebar .panel-title h2,
    .rpg-sidebar .field label { color: #ffe5a1; }

    .rpg-sidebar .panel-tag {
      background: #9d4f43;
      border-color: #e5a25e;
      color: #fff2c7;
    }

    .quest-nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }

    .quest-nav-item {
      display: grid;
      justify-items: center;
      gap: 0.2rem;
      padding: 0.55rem 0.25rem;
      border: 1px solid rgba(255, 224, 157, 0.28);
      border-radius: 10px;
      background: rgba(255, 242, 192, 0.08);
      color: #f7d98c;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .quest-nav-item.active {
      background: linear-gradient(180deg, #d99d46, #9b5632);
      border-color: #ffe09a;
      color: #fff9df;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 3px 0 rgba(38, 22, 12, 0.28);
    }

    .quest-nav-icon { font-size: 1.1rem; }

    .rpg-sidebar .neon-input {
      background: rgba(255, 248, 219, 0.12);
      border-color: rgba(255, 219, 139, 0.3);
      color: #fff7dc;
    }

    .rpg-sidebar .neon-input::placeholder { color: rgba(255, 233, 176, 0.56); }

    .rpg-sidebar .neon-input:focus {
      border-color: #f4c95d;
      box-shadow: 0 0 0 3px rgba(244, 201, 93, 0.18);
    }

    .rpg-sidebar select option { color: #3d2c20; }

    .log-panel { background: linear-gradient(180deg, rgba(255,252,239,0.96), rgba(235, 216, 173, 0.92)); }
  </style>
</head>
<body class="p-4 md:p-8 relative overflow-x-hidden">

  <header class="max-w-7xl mx-auto mb-8">
    <div class="hud-bar glass-card">
      <div class="game-logo">
        <div class="game-logo-mark">⚔️</div>
        <span>Quality Guild</span>
      </div>

      <div class="hud-stats">
        <div class="hud-pill">Guild <strong>mambers0908</strong></div>
        <div class="hud-pill">Rank <strong>QUALITY</strong></div>
        <div class="hud-pill">Status <strong>READY</strong></div>
      </div>

      <div class="mission-badge">
        <span>Quest</span>
        <strong>QUEST BOARD</strong>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    <section class="lg:col-span-4 glass-card rpg-sidebar rounded-2xl p-6 md:p-8 animate-float-card transition-all">
      <div class="panel-title">
        <h2>Quest Board</h2>
        <span class="panel-tag">Live</span>
      </div>

      <nav class="quest-nav" aria-label="Quest navigation">
        <div class="quest-nav-item active"><span class="quest-nav-icon">📝</span><span>New Quest</span></div>
        <div class="quest-nav-item"><span class="quest-nav-icon">📜</span><span>Log Book</span></div>
        <div class="quest-nav-item"><span class="quest-nav-icon">🏆</span><span>Rankings</span></div>
      </nav>

      <form id="defectForm" class="custom-form space-y-4">
        <div class="field">
          <label for="mo">MO Number</label>
          <input type="text" id="mo" required placeholder="例如：70185" class="w-full rounded-xl px-4 py-2.5 text-amber-50 placeholder-slate-400/70 neon-input">
        </div>

        <div class="field">
          <label for="partNo">Part No.</label>
          <input type="text" id="partNo" required placeholder="例如：Y121W18801" class="w-full rounded-xl px-4 py-2.5 text-amber-50 placeholder-slate-400/70 neon-input">
        </div>

        <div class="field">
          <label for="finish">Finish</label>
          <input type="text" id="finish" required placeholder="例如：A1S90-C" class="w-full rounded-xl px-4 py-2.5 text-amber-50 placeholder-slate-400/70 neon-input">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="field mb-0">
            <label for="inputQty">Input Qty</label>
            <input type="number" id="inputQty" required placeholder="233" class="w-full rounded-xl px-4 py-2.5 text-amber-50 placeholder-slate-400/70 neon-input">
          </div>
          <div class="field mb-0">
            <label for="defectQty">Defect Qty</label>
            <input type="number" id="defectQty" required placeholder="81" class="w-full rounded-xl px-4 py-2.5 text-amber-50 placeholder-slate-400/70 neon-input">
          </div>
        </div>

        <div class="field">
          <label for="severity">Severity</label>
          <select id="severity" required class="w-full rounded-xl px-4 py-2.5 text-amber-50 neon-input">
            <option value="輕微">輕微 (Minor)</option>
            <option value="進階">進階 (Moderate)</option>
            <option value="重點">重點 (Major)</option>
            <option value="至急">至急 (Critical)</option>
          </select>
        </div>

        <div class="field">
          <label for="remark">Investigation / Note</label>
          <textarea id="remark" rows="2" placeholder="例如：來料異物附著、雜物、白點" class="w-full rounded-xl px-4 py-2 text-amber-50 placeholder-slate-400/70 neon-input"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full mt-2 rounded-xl py-3 px-6 neon-button flex items-center justify-center gap-2">
          <span id="btnText">Write to Sheet</span>
          <div id="btnSpinner" class="hidden w-5 h-5 border-2 border-stone-950 border-t-transparent rounded-full animate-spin"></div>
        </button>
      </form>
    </section>

    <section class="lg:col-span-8 glass-card log-panel rounded-2xl p-6 md:p-8 animate-float-card-delayed transition-all min-h-[480px]">
      <div class="panel-title">
        <h2>Guild Log</h2>
        <button onclick="fetchMembers0908()" class="refresh-button text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          🔄 Refresh
        </button>
      </div>

      <div id="loadingState" class="flex flex-col items-center justify-center py-20 gap-4">
        <div class="neon-spinner"></div>
        <p class="text-sky-100/80 text-xs tracking-[0.24em] uppercase animate-pulse">Scanning data stream...</p>
      </div>

      <div id="tableContainer" class="hidden overflow-x-auto">
        <table class="game-table w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-700/80">
              <th class="py-3 px-3">MO</th>
              <th class="py-3 px-3">Part</th>
              <th class="py-3 px-3">Finish</th>
              <th class="py-3 px-3 text-right">Input</th>
              <th class="py-3 px-3 text-right">Defect</th>
              <th class="py-3 px-3">Note</th>
              <th class="py-3 px-3 text-center">Priority</th>
            </tr>
          </thead>
          <tbody id="defectTableBody" class="text-sm">
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="fixed bottom-6 right-6 translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50 glass-card px-6 py-4 rounded-xl border border-orange-400/30 flex items-center gap-3 shadow-2xl">
    <span class="text-2xl" id="toastIcon">✨</span>
    <div>
      <h4 id="toastTitle" class="font-semibold text-orange-200 text-sm">Notification</h4>
      <p id="toastMessage" class="text-slate-200/80 text-xs mt-0.5">Message</p>
    </div>
  </div>

  <script>
    /********************************************************************************
     * ★★★ 【請在此處更換您的串接網址】 ★★★
     * 請將下方 API_URL 引號內的占位符替換為您的 Google Apps Script 部署 URL。
     * 範例："https://script.google.com/macros/s/AKfycbx.../exec"
     ********************************************************************************/
    const API_URL = "https://script.google.com/macros/s/AKfycbzPV6UyR2Fjbdpu85l4jc0QKH3aOj_vWKjMKLmWtZVqinfkSYpsSMActpjG2CDQQX_zhQ/exec"; 
    
    // 指定讀取與寫入的工作表名稱
    const TARGET_SHEET = "mambers0908";

    // 頁面初次載入時自動執行 GET 請求
    document.addEventListener("DOMContentLoaded", () => {
      fetchMembers0908();
    });

    // 2. 資料讀取 (GET 請求)
    async function fetchMembers0908() {
      showLoading(true);
      try {
        const url = `${API_URL}?action=read&sheet=${encodeURIComponent(TARGET_SHEET)}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === "success") {
          renderTable(result.data);
        } else {
          showToast("讀取失敗", result.message || "遠端 API 回傳錯誤", "⚠️");
          renderEmptyTable("錯誤訊息：" + (result.message || "找不到指定工作表"));
        }
      } catch (error) {
        console.error("Fetch API Error:", error);
        showToast("提示", "請確認已將 API_URL 替換為您的 Google Apps Script 網址", "ℹ️");
        renderEmptyTable("連線失敗：請確認 API_URL 是否設定正確並發布為「所有人」");
      } finally {
        showLoading(false);
      }
    }

    // 動態渲染資料至表格 (含霓虹懸浮 Badge 標籤)
    function renderTable(dataList) {
      const tbody = document.getElementById("defectTableBody");
      tbody.innerHTML = "";

      if (!dataList || dataList.length === 0) {
        renderEmptyTable(`目前 ${TARGET_SHEET} 工作表中暫無不良紀錄數據`);
        return;
      }

      dataList.forEach(item => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-white/5 transition";

        const badgeStyle = getSeverityBadgeStyle(item.severity);

        tr.innerHTML = `
          <td class="py-3 px-3 font-mono text-xs text-amber-300/80">${escapeHtml(item.mo)}</td>
          <td class="py-3 px-3 text-amber-100 text-xs font-mono">${escapeHtml(item.partNo)}</td>
          <td class="py-3 px-3 text-amber-200/70 text-xs font-mono">${escapeHtml(item.finish)}</td>
          <td class="py-3 px-3 text-right font-mono text-amber-200/70">${item.inputQty ?? 0}</td>
          <td class="py-3 px-3 text-right font-mono text-pink-300 font-semibold">${item.defectQty ?? 0}</td>
          <td class="py-3 px-3 text-amber-200/70 text-xs max-w-[180px] truncate" title="${escapeHtml(item.remark)}">${escapeHtml(item.remark)}</td>
          <td class="py-3 px-3 text-center">
            <span class="inline-block px-2.5 py-1 rounded-full text-xs font-medium border ${badgeStyle}">
              ${escapeHtml(item.severity || '輕微')}
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 不良等級與相對應的霓虹懸浮 Badge 樣式
    function getSeverityBadgeStyle(severity) {
      switch (severity) {
        case "至急":
          return "bg-rose-500/20 text-rose-300 border-rose-500/50 shadow-[0_0_12px_rgba(244,63,94,0.5)] animate-pulse";
        case "重點":
          return "bg-amber-500/20 text-amber-300 border-amber-500/50 shadow-[0_0_10px_rgba(251,191,36,0.4)]";
        case "進階":
          return "bg-pink-500/20 text-pink-300 border-pink-500/50 shadow-[0_0_10px_rgba(244,114,182,0.4)]";
        case "輕微":
        default:
          return "bg-emerald-500/20 text-emerald-300 border-emerald-500/40 shadow-[0_0_8px_rgba(52,211,153,0.3)]";
      }
    }

    // 3. 資料寫入 (POST 請求)
    document.getElementById("defectForm").addEventListener("submit", async function(e) {
      e.preventDefault(); // 阻止表單預設行為

      const payload = { 
        sheet: TARGET_SHEET,
        mo: document.getElementById("mo").value.trim(),
        partNo: document.getElementById("partNo").value.trim(),
        finish: document.getElementById("finish").value.trim(),
        inputQty: parseInt(document.getElementById("inputQty").value) || 0,
        defectQty: parseInt(document.getElementById("defectQty").value) || 0,
        severity: document.getElementById("severity").value,
        remark: document.getElementById("remark").value.trim()
      };

      setSubmitLoading(true); // 按鈕載入狀態

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          // 避開 Google Apps Script CORS 限制
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          showToast("寫入成功", `資料已成功同步至 ${TARGET_SHEET}！`, "✨");
          document.getElementById("defectForm").reset(); // 清空表單
          fetchMembers0908(); // 自動刷新右側表格
        } else {
          showToast("寫入失敗", result.message || "處理失敗", "❌");
        }
      } catch (error) {
        console.error("POST API Error:", error);
        showToast("傳送失敗", "無法連線至遠端 API，請確認 API_URL 是否正確", "❌");
      } finally {
        setSubmitLoading(false);
      }
    });

    function renderEmptyTable(message) {
      const tbody = document.getElementById("defectTableBody");
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-10 text-amber-200/40 font-light">${escapeHtml(message)}</td>
        </tr>
      `;
    }

    function showLoading(isLoading) {
      const loader = document.getElementById("loadingState");
      const table = document.getElementById("tableContainer");
      if (isLoading) {
        loader.classList.remove("hidden");
        table.classList.add("hidden");
      } else {
        loader.classList.add("hidden");
        table.classList.remove("hidden");
      }
    }

    function setSubmitLoading(isLoading) {
      const btn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");

      btn.disabled = isLoading;
      if (isLoading) {
        btnText.textContent = "寫入遠端中...";
        btnSpinner.classList.remove("hidden");
      } else {
        btnText.textContent = `寫入至 ${TARGET_SHEET}`;
        btnSpinner.classList.add("hidden");
      }
    }

    // 美化提示框 (Toast Notification)
    function showToast(title, message, icon = "✨") {
      const toast = document.getElementById("toast");
      document.getElementById("toastIcon").textContent = icon;
      document.getElementById("toastTitle").textContent = title;
      document.getElementById("toastMessage").textContent = message;

      toast.classList.remove("translate-y-20", "opacity-0", "pointer-events-none");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0", "pointer-events-none");
      }, 3500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
